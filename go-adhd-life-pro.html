<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NotoMantra — Welcome</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:transparent}
  body{display:grid;place-items:center;padding:4px 16px;font-synthesis:none;-webkit-font-smoothing:antialiased}
  .widget{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:19px;text-align:center}
  .welcome{position:relative;width:100%;height:34px;overflow:hidden;color:#6c625b;font-family:Georgia,'Iowan Old Style','Baskerville','Times New Roman',serif;font-size:clamp(14px,2.5vw,18px);font-style:italic;font-weight:400;line-height:34px;letter-spacing:.012em}
  .message{position:absolute;inset:0;display:block;white-space:nowrap;opacity:0;transform:translateY(5px);animation:phrases 24s ease-in-out infinite}
  .message:nth-child(2){animation-delay:8s}
  .message:nth-child(3){animation-delay:16s}
  @keyframes phrases{0%{opacity:0;transform:translateY(5px)}5%,29%{opacity:1;transform:translateY(0)}33.333%,100%{opacity:0;transform:translateY(-5px)}}
  .link{color:#39332f;text-decoration:none;font-family:Georgia,'Iowan Old Style','Baskerville','Times New Roman',serif;font-size:14px;line-height:22px;letter-spacing:.045em;border-bottom:1px solid #bfb5a9;padding:0 1px 3px;transition:color .3s,border-color .3s}
  .link:hover,.link:focus-visible{color:#a47757;border-color:currentColor}
  .link:focus-visible{outline:2px solid currentColor;outline-offset:5px}
  @media(prefers-color-scheme:dark){.welcome{color:#c8bdb2}.link{color:#ebe2d8;border-color:#786f67}.link:hover{color:#f4c9a1}}
  @media(max-width:480px){body{padding-inline:8px}.welcome{font-size:clamp(11px,3vw,15px)}}
  @media(prefers-reduced-motion:reduce){.message{animation:none;opacity:0;transform:none}.message:first-child{opacity:1}}
</style>
</head>
<body>
  <main class="widget" aria-label="Welcome to your NotoMantra template">
    <div class="welcome" aria-label="Welcome. Make this little space your own.">
      <span class="message" aria-hidden="true">Welcome to a little space of your own.</span>
      <span class="message" aria-hidden="true">Clear the sample entries to begin your story.</span>
      <span class="message" aria-hidden="true">Make it yours, one lovely detail at a time.</span>
    </div>
    <a class="link" href="https://notomantra.gumroad.com/l/adhd-life-pro" target="_blank" rel="noopener noreferrer">See full OS</a>
  </main>
</body>
</html>
