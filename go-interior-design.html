<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NotoMantra — Welcome</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:0;background:transparent}
body{font-synthesis:none;-webkit-font-smoothing:antialiased}
.widget{display:flex;width:100%;height:100%;min-height:76px;padding:8px 7px;align-items:center;justify-content:center;flex-direction:column;gap:clamp(6px,2.5vh,19px);text-align:center;text-decoration:none;cursor:pointer;color:inherit}
.welcome{position:relative;width:100%;height:clamp(30px,7vh,38px);flex:none;overflow:hidden;color:#6c625b;font-family:Georgia,'Iowan Old Style',Baskerville,'Times New Roman',serif;font-size:clamp(11px,2.5vw,18px);font-style:italic;font-weight:400;line-height:1.35;letter-spacing:.012em}
.message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(5px);animation:phrases 24s ease-in-out infinite}
.message:nth-child(2){animation-delay:8s}
.message:nth-child(3){animation-delay:16s}
@keyframes phrases{0%{opacity:0;transform:translateY(5px)}5%,29%{opacity:1;transform:translateY(0)}33.333%,100%{opacity:0;transform:translateY(-5px)}}
.link{color:#39332f;font-family:Georgia,'Iowan Old Style',Baskerville,'Times New Roman',serif;font-size:clamp(12px,2vw,14px);line-height:22px;letter-spacing:.045em;border-bottom:1px solid #bfb5a9;padding:0 1px 3px;transition:color .3s,border-color .3s}
.widget:hover .link,.widget:focus-visible .link{color:#a47757;border-color:currentColor}
.widget:focus-visible{outline:2px solid #a47757;outline-offset:-3px}
@media(prefers-color-scheme:dark){.welcome{color:#c8bdb2}.link{color:#ebe2d8;border-color:#786f67}.widget:hover .link{color:#f4c9a1}}
@media(max-width:480px){.welcome{font-size:clamp(10px,3vw,15px)}}
@media(prefers-reduced-motion:reduce){.message{animation:none;opacity:0;transform:none}.message:first-child{opacity:1}}
</style>
</head>
<body>
<a class="widget" href="https://notomantra.gumroad.com/l/interior-design" target="_blank" rel="noopener noreferrer" aria-label="See full OS — NotoMantra">
  <div class="welcome" aria-hidden="true">
    <span class="message">Welcome to a little space of your own.</span>
    <span class="message">Clear the sample entries to begin your story.</span>
    <span class="message">Make it yours, one lovely detail at a time.</span>
  </div>
  <span class="link">See full OS</span>
</a>
</body>
</html>
